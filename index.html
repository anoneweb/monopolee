<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bisnis Sederhana</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f0f8ff; }
        h1 { color: #2c3e50; }
        
        /* Area Papan Utama */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 20px auto;
        }

        .tile {
            border: 2px solid #333;
            padding: 15px;
            background: white;
            border-radius: 8px;
            position: relative;
            min-height: 80px;
            font-size: 14px;
        }

        .tile.player-here { border-color: #e74c3c; background-color: #fadbd8; }
        .owned { background-color: #d5f5e3; }

        /* Panel Kontrol */
        #controls {
            margin-top: 20px;
            padding: 20px;
            background: #fff;
            border-top: 2px solid #ccc;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover { background-color: #2980b9; }
        
        #log {
            margin-top: 15px;
            color: #555;
            font-style: italic;
            height: 30px;
        }

        #stats { font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>🏰 Game Bisnis Mini</h1>
    
    <div id="stats">
        Uang: <span id="money">Rp 1000</span> | Posisi: <span id="position">Start</span>
    </div>

    <div id="game-board">
        </div>

    <div id="controls">
        <div id="log">Klik kocok dadu untuk mulai!</div>
        <button onclick="playTurn()">🎲 Kocok Dadu</button>
    </div>

<script>
    // --- KONFIGURASI GAME ---
    const boardData = [
        { name: "Start", type: "start", price: 0 },
        { name: "Tanah A", type: "property", price: 100, rent: 20, owner: null },
        { name: "Tanah B", type: "property", price: 150, rent: 30, owner: null },
        { name: "Pajak", type: "tax", price: 50 },
        { name: "Tanah C", type: "property", price: 200, rent: 40, owner: null },
        { name: "Penjara", type: "jail", price: 0 },
        { name: "Tanah D", type: "property", price: 250, rent: 50, owner: null },
        { name: "Parkir", type: "parking", price: 0 },
        { name: "Tanah E", type: "property", price: 300, rent: 60, owner: null },
        { name: "Kesempatan", type: "chance", price: 0 },
        { name: "Tanah F", type: "property", price: 350, rent: 70, owner: null },
        { name: "Tanah G", type: "property", price: 400, rent: 80, owner: null }
    ];

    let player = {
        money: 1000,
        position: 0 // Index array boardData
    };

    const boardEl = document.getElementById("game-board");
    const logEl = document.getElementById("log");
    const moneyEl = document.getElementById("money");
    const posEl = document.getElementById("position");

    // --- INISIALISASI PAPAN ---
    function renderBoard() {
        boardEl.innerHTML = '';
        boardData.forEach((tile, index) => {
            const div = document.createElement("div");
            div.className = "tile";
            if (index === player.position) div.classList.add("player-here");
            if (tile.owner === 'player') div.classList.add("owned");

            let content = `<strong>${tile.name}</strong><br>`;
            if (tile.type === 'property') {
                content += `H: ${tile.price} | S: ${tile.rent}`;
                if (tile.owner === 'player') content += `<br>✅ Milikmu`;
            }
            
            div.innerHTML = content;
            boardEl.appendChild(div);
        });
        
        moneyEl.innerText = "Rp " + player.money;
        posEl.innerText = boardData[player.position].name;
    }

    // --- LOGIKA PERMAINAN ---
    function playTurn() {
        // 1. Kocok Dadu
        const dice = Math.floor(Math.random() * 4) + 1; // Dadu kecil 1-4 agar game tidak terlalu cepat
        logEl.innerText = `Kamu melempar angka ${dice}...`;

        // 2. Pindah Posisi
        player.position = (player.position + dice) % boardData.length;
        
        // Cek jika melewati start (tambah uang)
        if (player.position < dice && player.position !== 0) { 
            player.money += 100;
            logEl.innerText += " Lewat Start (+100)!";
        }

        renderBoard(); // Update visual posisi
        
        // 3. Cek Kotak Saat Ini
        setTimeout(() => checkTile(), 500);
    }

    function checkTile() {
        const tile = boardData[player.position];

        if (tile.type === 'property') {
            if (tile.owner === null) {
                // Tawarkan beli
                if (player.money >= tile.price) {
                    let buy = confirm(`Kamu mendarat di ${tile.name}.\nHarga: ${tile.price}.\nUangmu: ${player.money}.\nMau beli?`);
                    if (buy) {
                        player.money -= tile.price;
                        tile.owner = 'player';
                        logEl.innerText = `Kamu membeli ${tile.name}!`;
                    } else {
                        logEl.innerText = `Kamu tidak membeli ${tile.name}.`;
                    }
                } else {
                    logEl.innerText = `Uang tidak cukup untuk membeli ${tile.name}.`;
                }
            } else if (tile.owner === 'player') {
                logEl.innerText = "Ini properti milikmu, santai saja.";
            }
        } 
        else if (tile.type === 'tax') {
            player.money -= tile.price;
            logEl.innerText = `Kena Pajak! Bayar ${tile.price}.`;
        }
        else if (tile.type === 'jail') {
            logEl.innerText = "Hanya berkunjung ke Penjara.";
        }
        else if (tile.type === 'chance') {
            const luck = Math.random() > 0.5 ? 50 : -50;
            player.money += luck;
            logEl.innerText = luck > 0 ? "Dapat hadiah Rp 50!" : "Dompetmu jatuh! Hilang Rp 50.";
        }

        // Cek Game Over
        if (player.money < 0) {
            alert("Kamu Bangkrut! Game Over.");
            location.reload();
        }

        renderBoard();
    }

    // Mulai render pertama
    renderBoard();

</script>
</body>
</html>
