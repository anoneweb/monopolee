<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Template Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5568;
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        textarea:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 1px #3182ce;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: white;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-generate { background-color: #3182ce; }
        .btn-clear { background-color: #e53e3e; }
        .btn-copy { background-color: #38a169; width: 100%; margin-top: 15px;}
    </style>
</head>
<body>

    <div class="container">
        <h2>Report Template Generator</h2>
        
        <div class="grid">
            <!-- Kolom Input (Format A) -->
            <div class="form-group">
                <label for="inputA">Format A (Input)</label>
                <textarea id="inputA" placeholder="Paste data Format A di sini..."></textarea>
                <div class="btn-group">
                    <button class="btn-generate" onclick="generateReport()">Generate ➔</button>
                    <button class="btn-clear" onclick="clearFields()">Clear</button>
                </div>
            </div>

            <!-- Kolom Output (Format B) -->
            <div class="form-group">
                <label for="outputB">Format B (Output)</label>
                <textarea id="outputB" readonly placeholder="Hasil Format B akan muncul di sini..."></textarea>
                <button class="btn-copy" onclick="copyOutput()">📋 Copy Hasil</button>
            </div>
        </div>
    </div>

    <script>
        function generateReport() {
            const input = document.getElementById('inputA').value;
            const lines = input.split('\n');

            // Variabel penampung data
            let pabx = '', noIh = '', tiket = '';
            let nama = '', cp = '', detailCase = '', lapulGaul = '', capt = '';

            // Ekstrak Baris 1: PABX / NoIH / Case / HVC / #CXDanantara
            if (lines.length > 0 && lines[0].includes('/')) {
                const parts = lines[0].split('/');
                if (parts.length >= 3) {
                    pabx = parts[0].trim();
                    noIh = parts[1].trim();
                    
                    const casePart = parts[2].trim();
                    // Regex khusus untuk menangkap tiket dengan format 1-XXXXXXX
                    const ticketMatch = casePart.match(/1-[a-zA-Z0-9]+/);
                    if (ticketMatch) {
                        tiket = ticketMatch[0];
                    }
                }
            }

            // Loop sisa baris untuk mengambil data spesifik
            lines.forEach(line => {
                // Menggunakan substring & indexOf agar tidak error jika ada tanda ':' ganda pada link http
                if (line.startsWith('Nama Pelanggan :')) {
                    nama = line.substring(line.indexOf(':') + 1).trim();
                } else if (line.startsWith('CP :')) {
                    cp = line.substring(line.indexOf(':') + 1).trim();
                } else if (line.startsWith('Detail case :')) {
                    detailCase = line.substring(line.indexOf(':') + 1).trim();
                } else if (line.startsWith('Lapul/Gaul :')) {
                    lapulGaul = line.substring(line.indexOf(':') + 1).trim();
                } else if (line.startsWith('Capt lightshoot :')) {
                    capt = line.substring(line.indexOf(':') + 1).trim();
                }
            });

            // Mapping ke Format B
            const output = `No Tiket : ${tiket}
No Indihome : ${noIh}
Nama Pelanggan : ${nama}
NIK : 
CP : ${cp}
Email : 
OrderID : 
Tgl Kejadian : 
Case : ${detailCase}
Capt lightshoot : ${capt}
Loker : CC SMG 
Solusi : 
Pool ID : 
Siad : 
Pabx : ${pabx}
Lapul : ${lapulGaul}
Gaul : ${lapulGaul}
Hasil cek tools terakhir : 
Tanggal cek tools : 
Note : 
- No extension TL saat take over / Callback pelanggan: 
- CP yang dihubungi TL : 
- Analisa TL : 
- Note : 
#Specialcase`;

            document.getElementById('outputB').value = output;
        }

        function clearFields() {
            document.getElementById('inputA').value = '';
            document.getElementById('outputB').value = '';
            document.getElementById('inputA').focus();
        }

        function copyOutput() {
            const outputText = document.getElementById('outputB');
            if (!outputText.value) {
                alert("Tidak ada data untuk disalin!");
                return;
            }
            outputText.select();
            outputText.setSelectionRange(0, 99999); // Untuk perangkat mobile
            
            navigator.clipboard.writeText(outputText.value).then(() => {
                const btnCopy = document.querySelector('.btn-copy');
                const originalText = btnCopy.innerHTML;
                btnCopy.innerHTML = "✅ Berhasil Disalin!";
                setTimeout(() => {
                    btnCopy.innerHTML = originalText;
                }, 2000);
            }).catch(err => {
                alert("Gagal menyalin teks.");
            });
        }
    </script>
</body>
</html>
