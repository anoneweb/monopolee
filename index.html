<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Monopoli vs Bot</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f4f4f4; color: #333; }
        h1 { margin-bottom: 10px; }
        
        /* Area Status Pemain */
        #scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .player-card {
            padding: 10px 20px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 150px;
        }
        .p1-card { border-bottom: 5px solid #3498db; } /* Biru untuk Kamu */
        .cpu-card { border-bottom: 5px solid #e74c3c; } /* Merah untuk Bot */

        /* Papan Permainan */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tile {
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            min-height: 90px;
            position: relative;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Marker Pemain di Papan */
        .markers {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: none; }
        .dot.p1 { background-color: #3498db; display: block; border: 1px solid #fff; }
        .dot.cpu { background-color: #e74c3c; display: block; border: 1px solid #fff; }

        /* Warna Pemilik Tanah */
        .owned-p1 { background-color: #d6eaf8; border-color: #3498db; }
        .owned-cpu { background-color: #fadbd8; border-color: #e74c3c; }

        /* Panel Kontrol */
        #controls {
            margin-top: 25px;
            padding: 15px;
            background: white;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        #log {
            margin-top: 10px;
            font-style: italic;
            height: 40px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>🏰 Monopoli: Kamu vs Bot</h1>

    <div id="scoreboard">
        <div class="player-card p1-card">
            <strong>👤 KAMU (Biru)</strong><br>
            <span id="p1-money">Rp 1000</span>
        </div>
        <div class="player-card cpu-card">
            <strong>🤖 BOT (Merah)</strong><br>
            <span id="cpu-money">Rp 1000</span>
        </div>
    </div>

    <div id="game-board"></div>

    <div id="controls">
        <div id="log">Klik tombol untuk mulai main!</div>
        <br>
        <button id="btn-roll" onclick="humanTurn()">🎲 Kocok Dadu</button>
    </div>

<script>
    // --- DATA & SETUP ---
    const boardData = [
        { name: "START", type: "start", price: 0 },
        { name: "Jkt Pusat", type: "property", price: 100, rent: 20, owner: null },
        { name: "Jkt Selatan", type: "property", price: 120, rent: 25, owner: null },
        { name: "PAJAK", type: "tax", price: 50 },
        { name: "Bekasi", type: "property", price: 150, rent: 30, owner: null },
        { name: "PENJARA", type: "jail", price: 0 },
        { name: "Depok", type: "property", price: 180, rent: 35, owner: null },
        { name: "PARKIR", type: "parking", price: 0 },
        { name: "Tangerang", type: "property", price: 200, rent: 40, owner: null },
        { name: "DANA UMUM", type: "chance", price: 0 },
        { name: "Bogor", type: "property", price: 220, rent: 45, owner: null },
        { name: "Bandung", type: "property", price: 250, rent: 50, owner: null }
    ];

    let p1 = { name: "Kamu", money: 1000, position: 0, id: 'p1' };
    let cpu = { name: "Bot", money: 1000, position: 0, id: 'cpu' };
    
    let isGameActive = true;

    // --- RENDER FUNCTION ---
    function renderBoard() {
        const boardEl = document.getElementById("game-board");
        boardEl.innerHTML = '';

        boardData.forEach((tile, index) => {
            const div = document.createElement("div");
            div.className = "tile";
            
            // Warna background jika dimiliki
            if (tile.owner === 'p1') div.classList.add("owned-p1");
            if (tile.owner === 'cpu') div.classList.add("owned-cpu");

            // Marker Posisi Pemain
            let markersHtml = '<div class="markers">';
            if (p1.position === index) markersHtml += '<div class="dot p1"></div>';
            if (cpu.position === index) markersHtml += '<div class="dot cpu"></div>';
            markersHtml += '</div>';

            // Konten Teks
            let content = `<b>${tile.name}</b>`;
            if (tile.type === 'property') {
                content += `<br><small>H: ${tile.price} | S: ${tile.rent}</small>`;
                if (tile.owner === 'p1') content += `<br><small>✅ Milikmu</small>`;
                if (tile.owner === 'cpu') content += `<br><small>⛔ Milik Bot</small>`;
            } else if (tile.type === 'tax') {
                content += `<br><small>Bayar: ${tile.price}</small>`;
            }

            div.innerHTML = markersHtml + content;
            boardEl.appendChild(div);
        });

        // Update UI Uang
        document.getElementById("p1-money").innerText = "Rp " + p1.money;
        document.getElementById("cpu-money").innerText = "Rp " + cpu.money;
    }

    function updateLog(msg) {
        document.getElementById("log").innerText = msg;
    }

    // --- CORE GAMEPLAY ---
    function movePlayer(playerObj, steps) {
        playerObj.position = (playerObj.position + steps) % boardData.length;
        
        // Lewat start dapat uang
        if (playerObj.position < steps && playerObj.position !== 0) {
            playerObj.money += 100;
            updateLog(`${playerObj.name} lewat Start (+100)!`);
        }
        renderBoard();
    }

    function checkTile(playerObj) {
        if (!isGameActive) return;

        const tile = boardData[playerObj.position];
        const isHuman = playerObj.id === 'p1';
        const opponent = isHuman ? cpu : p1;

        // 1. Logika Properti
        if (tile.type === 'property') {
            // A. Tanah Kosong
            if (tile.owner === null) {
                if (playerObj.money >= tile.price) {
                    if (isHuman) {
                        // Human: Tanya dulu
                        setTimeout(() => {
                            let buy = confirm(`Tanah Kosong: ${tile.name}\nHarga: ${tile.price}\nBeli?`);
                            if (buy) {
                                buyProperty(playerObj, tile);
                                passTurnToCpu();
                            } else {
                                updateLog("Kamu tidak membeli tanah.");
                                passTurnToCpu();
                            }
                        }, 200);
                        return; // Stop disini menunggu confirm
                    } else {
                        // Bot: Selalu beli jika uang cukup
                        buyProperty(playerObj, tile);
                    }
                } else {
                    updateLog(`${playerObj.name} tidak cukup uang beli tanah.`);
                }
            } 
            // B. Tanah Lawan (Bayar Sewa)
            else if (tile.owner !== playerObj.id) {
                playerObj.money -= tile.rent;
                opponent.money += tile.rent;
                updateLog(`Ouch! ${playerObj.name} bayar sewa ${tile.rent} ke ${opponent.name}.`);
            }
        } 
        
        // 2. Logika Pajak
        else if (tile.type === 'tax') {
            playerObj.money -= tile.price;
            updateLog(`${playerObj.name} kena pajak ${tile.price}.`);
        }
        
        // 3. Logika Chance
        else if (tile.type === 'chance') {
            const luck = Math.random() > 0.5 ? 50 : -50;
            playerObj.money += luck;
            updateLog(`${playerObj.name} dapat Dana Umum: ${luck}`);
        }

        renderBoard();
        checkGameOver();

        // Jika Human, turn selesai setelah checkTile (kecuali beli tanah yg async)
        if (isHuman && tile.owner !== null) {
            passTurnToCpu();
        }
    }

    function buyProperty(playerObj, tile) {
        playerObj.money -= tile.price;
        tile.owner = playerObj.id;
        updateLog(`${playerObj.name} membeli ${tile.name}!`);
        renderBoard();
    }

    function checkGameOver() {
        if (p1.money < 0) {
            alert("Kamu Bangkrut! Bot Menang 🤖");
            isGameActive = false;
            location.reload();
        } else if (cpu.money < 0) {
            alert("Bot Bangkrut! KAMU MENANG 🎉");
            isGameActive = false;
            location.reload();
        }
    }

    // --- TURN MANAGEMENT ---
    function humanTurn() {
        if (!isGameActive) return;
        const btn = document.getElementById("btn-roll");
        btn.disabled = true; // Matikan tombol agar tidak spam

        const dice = Math.floor(Math.random() * 4) + 1;
        updateLog(`Kamu melempar angka ${dice}...`);
        
        movePlayer(p1, dice);
        
        // Cek tile (tunggu animasi render sebentar)
        setTimeout(() => checkTile(p1), 500);
    }

    function passTurnToCpu() {
        if (!isGameActive) return;
        updateLog("Giliran Bot berpikir...");
        
        // Delay 1.5 detik agar terasa "mikir"
        setTimeout(() => {
            cpuTurn();
        }, 1500);
    }

    function cpuTurn() {
        const dice = Math.floor(Math.random() * 4) + 1;
        updateLog(`Bot melempar angka ${dice}...`);
        
        movePlayer(cpu, dice);
        checkTile(cpu); // Bot otomatis handle logic

        // Kembalikan giliran ke player
        setTimeout(() => {
            if (isGameActive) {
                updateLog("Giliranmu! Silakan kocok dadu.");
                document.getElementById("btn-roll").disabled = false;
            }
        }, 1000);
    }

    // Start
    renderBoard();

</script>
</body>
</html>
