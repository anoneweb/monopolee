<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoli Nusantara</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #f72585;
            --bg: #2b2d42;
            --board-bg: #edf2f4;
            --center-bg: #8d99ae;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: auto; /* Allow scroll for big board */
        }

        /* --- LAYOUT PAPAN KOTAK (GRID) --- */
        #game-container {
            position: relative;
            background: var(--board-bg);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            /* Grid 12 kolom x 11 baris untuk 42 kotak */
            display: grid;
            grid-template-columns: repeat(12, 90px); 
            grid-template-rows: repeat(11, 90px);
            gap: 4px;
            width: fit-content;
        }

        /* Tampilan Kotak/Tile */
        .tile {
            background: white;
            border: 1px solid #ccc;
            font-size: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            text-align: center;
            overflow: hidden;
        }

        .tile-header { font-weight: 800; font-size: 10px; line-height: 1.2; height: 35px; display: flex; align-items: center; justify-content: center; background: #eee; margin: -5px -5px 5px -5px; }
        .tile-price { font-size: 9px; color: #666; }
        
        /* Warna Region (Header) */
        .sumatera .tile-header { background: #fab1a0; }
        .jawa .tile-header { background: #81ecec; }
        .kalimantan .tile-header { background: #ffeaa7; }
        .sulawesi .tile-header { background: #a29bfe; color: white; }
        .balinusa .tile-header { background: #fd79a8; color: white; }
        .papuamaluku .tile-header { background: #ff7675; color: white; }
        .corner .tile-header { background: #b2bec3; height: 100%; font-size: 14px; }

        /* Kepemilikan */
        .owned-p1 { border: 3px solid var(--primary); background: #e3f2fd; }
        .owned-cpu { border: 3px solid var(--secondary); background: #fce4ec; }

        /* --- AREA TENGAH (CONTROLS) --- */
        #center-area {
            grid-column: 2 / 12;
            grid-row: 2 / 11;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            border: 2px dashed #ccc;
        }

        h1 { margin: 0 0 10px 0; font-size: 2rem; color: var(--bg); }
        
        #scoreboard { display: flex; gap: 20px; margin-bottom: 20px; width: 100%; justify-content: center; }
        .player-card {
            padding: 10px 20px; border-radius: 10px; background: #f8f9fa;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 120px;
        }
        .p1-active { border: 3px solid var(--primary); transform: scale(1.1); }
        .cpu-active { border: 3px solid var(--secondary); transform: scale(1.1); }

        #log-box {
            height: 60px; overflow-y: auto; width: 80%;
            background: #eee; padding: 10px; border-radius: 5px;
            font-size: 12px; margin-bottom: 15px; font-style: italic;
        }

        .btn-main {
            background: var(--primary); color: white; border: none;
            padding: 15px 40px; border-radius: 30px; font-size: 16px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-main:disabled { background: #ccc; }

        /* Marker Pemain */
        .token {
            width: 15px; height: 15px; border-radius: 50%;
            border: 2px solid white; position: absolute; bottom: 5px;
            z-index: 10; box-shadow: 0 2px 2px rgba(0,0,0,0.3);
        }
        .token.p1 { background: var(--primary); left: 5px; }
        .token.cpu { background: var(--secondary); right: 5px; }

        /* Modal */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 300px; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn-modal { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="center-area">
        <h1>🇮🇩 MONOPOLI NUSANTARA</h1>
        <div id="scoreboard">
            <div id="card-p1" class="player-card">
                <div>👤 KAMU</div>
                <h3 id="p1-money">Rp 1500</h3>
            </div>
            <div id="card-cpu" class="player-card">
                <div>🤖 BOT</div>
                <h3 id="cpu-money">Rp 1500</h3>
            </div>
        </div>
        <div id="log-box">Selamat datang! Kelilingi Indonesia dan kuasai properti.</div>
        <button id="btn-roll" class="btn-main" onclick="humanTurn()">🎲 KOCOK DADU</button>
    </div>
    
    </div>

<div id="modal-overlay">
    <div class="modal-box">
        <h3 id="modal-title"></h3>
        <p id="modal-msg"></p>
        <div class="btn-group" id="modal-btns"></div>
    </div>
</div>

<script>
    // --- DATABASE 38 PROVINSI + 4 CORNERS (Total 42) ---
    // Urutan: Top Row (Kiri->Kanan), Right Col (Atas->Bawah), Bottom Row (Kanan->Kiri), Left Col (Bawah->Atas)
    // Agar membentuk loop searah jarum jam mulai dari kiri atas.
    
    const boardData = [
        // --- TOP ROW (12 Kotak) : Sumatera & Start ---
        { name: "START", type: "start", price: 0, region: "corner" }, // 0
        { name: "Banda Aceh", type: "property", price: 60, rent: 10, region: "sumatera" },
        { name: "Medan", type: "property", price: 60, rent: 10, region: "sumatera" },
        { name: "Padang", type: "property", price: 80, rent: 15, region: "sumatera" },
        { name: "Pekanbaru", type: "property", price: 100, rent: 20, region: "sumatera" },
        { name: "Tj. Pinang", type: "property", price: 100, rent: 20, region: "sumatera" },
        { name: "Jambi", type: "property", price: 120, rent: 25, region: "sumatera" },
        { name: "Bengkulu", type: "property", price: 120, rent: 25, region: "sumatera" },
        { name: "Palembang", type: "property", price: 140, rent: 30, region: "sumatera" },
        { name: "Pkl. Pinang", type: "property", price: 140, rent: 30, region: "sumatera" },
        { name: "B. Lampung", type: "property", price: 160, rent: 35, region: "sumatera" },
        { name: "PENJARA", type: "jail", price: 0, region: "corner" }, // 11

        // --- RIGHT COLUMN (9 Kotak) : Jawa ---
        { name: "Serang", type: "property", price: 180, rent: 40, region: "jawa" }, // 12
        { name: "Jakarta", type: "property", price: 350, rent: 100, region: "jawa" },
        { name: "Bandung", type: "property", price: 200, rent: 45, region: "jawa" },
        { name: "Semarang", type: "property", price: 200, rent: 45, region: "jawa" },
        { name: "Yogyakarta", type: "property", price: 220, rent: 50, region: "jawa" },
        { name: "Surabaya", type: "property", price: 240, rent: 55, region: "jawa" },
        { name: "Denpasar", type: "property", price: 260, rent: 60, region: "balinusa" },
        { name: "Mataram", type: "property", price: 260, rent: 60, region: "balinusa" },
        { name: "Kupang", type: "property", price: 280, rent: 65, region: "balinusa" }, // 20

        // --- BOTTOM ROW (12 Kotak - Mundur) : Kalimantan & Parkir ---
        { name: "PARKIR", type: "parking", price: 0, region: "corner" }, // 21
        { name: "Pontianak", type: "property", price: 300, rent: 70, region: "kalimantan" },
        { name: "Palangkaraya", type: "property", price: 300, rent: 70, region: "kalimantan" },
        { name: "Banjarmasin", type: "property", price: 320, rent: 75, region: "kalimantan" },
        { name: "Samarinda", type: "property", price: 350, rent: 80, region: "kalimantan" }, // IKN dekat sini
        { name: "Tj. Selor", type: "property", price: 320, rent: 75, region: "kalimantan" },
        { name: "Manado", type: "property", price: 300, rent: 70, region: "sulawesi" },
        { name: "Gorontalo", type: "property", price: 300, rent: 70, region: "sulawesi" },
        { name: "Palu", type: "property", price: 280, rent: 65, region: "sulawesi" },
        { name: "Mamuju", type: "property", price: 280, rent: 65, region: "sulawesi" },
        { name: "Makassar", type: "property", price: 260, rent: 60, region: "sulawesi" },
        { name: "KESEMPATAN", type: "chance", price: 0, region: "corner" }, // 32

        // --- LEFT COLUMN (9 Kotak - Naik) : Sulawesi Sisa, Maluku, Papua ---
        { name: "Kendari", type: "property", price: 260, rent: 60, region: "sulawesi" }, // 33
        { name: "Ambon", type: "property", price: 240, rent: 55, region: "papuamaluku" },
        { name: "Sofifi", type: "property", price: 240, rent: 55, region: "papuamaluku" },
        { name: "Manokwari", type: "property", price: 220, rent: 50, region: "papuamaluku" },
        { name: "Sorong", type: "property", price: 220, rent: 50, region: "papuamaluku" },
        { name: "Jayapura", type: "property", price: 200, rent: 45, region: "papuamaluku" },
        { name: "Wamena", type: "property", price: 180, rent: 40, region: "papuamaluku" },
        { name: "Nabire", type: "property", price: 180, rent: 40, region: "papuamaluku" },
        { name: "Merauke", type: "property", price: 180, rent: 40, region: "papuamaluku" } // 41 -> Kembali ke 0
    ];

    let p1 = { name: "Kamu", money: 1500, position: 0, id: 'p1' };
    let cpu = { name: "Bot", money: 1500, position: 0, id: 'cpu' };
    let isGameActive = true;

    // --- SETUP GRID (Melingkar) ---
    function renderBoard() {
        const container = document.getElementById("game-container");
        // Hapus elemen tile lama (sisakan center-area)
        const oldTiles = document.querySelectorAll('.tile');
        oldTiles.forEach(t => t.remove());

        boardData.forEach((tile, index) => {
            const div = document.createElement("div");
            div.className = `tile ${tile.region}`;
            if(tile.owner === 'p1') div.classList.add("owned-p1");
            if(tile.owner === 'cpu') div.classList.add("owned-cpu");

            // LOGIKA POSISI GRID (Looping Square 12x11)
            let col, row;
            // 0-11: Top Row (Kiri ke Kanan) -> Row 1, Col 1-12
            if (index <= 11) { row = 1; col = index + 1; }
            // 12-20: Right Col (Atas ke Bawah) -> Col 12, Row 2-10
            else if (index <= 20) { row = index - 10; col = 12; }
            // 21-32: Bottom Row (Kanan ke Kiri) -> Row 11, Col 12-1
            else if (index <= 32) { row = 11; col = 12 - (index - 21); }
            // 33-41: Left Col (Bawah ke Atas) -> Col 1, Row 10-2
            else { col = 1; row = 11 - (index - 32); }

            div.style.gridColumn = col;
            div.style.gridRow = row;

            // Konten Tile
            let content = `<div class="tile-header">${tile.name}</div>`;
            if (tile.type === 'property') {
                content += `<div>Rp ${tile.price}</div>`;
                if(tile.owner) content += `<small>${tile.owner==='p1'?'Milikmu':'Bot'}</small>`;
            } else {
                content += `<small>${tile.type.toUpperCase()}</small>`;
            }

            // Marker
            if (p1.position === index) content += `<div class="token p1"></div>`;
            if (cpu.position === index) content += `<div class="token cpu"></div>`;

            div.innerHTML = content;
            container.appendChild(div);
        });

        // Update UI Info
        document.getElementById("p1-money").innerText = `Rp ${p1.money}`;
        document.getElementById("cpu-money").innerText = `Rp ${cpu.money}`;
        
        // Highlight Active Player
        const p1Card = document.getElementById("card-p1");
        const cpuCard = document.getElementById("card-cpu");
        if(isGameActive) {
            // Reset active class logic handled in turns
        }
    }

    function updateLog(msg) {
        const log = document.getElementById("log-box");
        log.innerHTML = `> ${msg}<br>` + log.innerHTML;
    }

    // --- GAME LOGIC ---
    function movePlayer(player, steps) {
        const oldPos = player.position;
        player.position = (player.position + steps) % boardData.length;
        
        // Cek lewat start
        if (player.position < oldPos && player.position !== 0) {
            player.money += 200;
            updateLog(`🔄 ${player.name} lewat Start (+200)`);
        }
        renderBoard();
    }

    function checkTile(player) {
        if (!isGameActive) return;
        const tile = boardData[player.position];
        const isHuman = player.id === 'p1';
        const opponent = isHuman ? cpu : p1;

        if (tile.type === 'property') {
            if (tile.owner === null) {
                if (player.money >= tile.price) {
                    if (isHuman) {
                        showModal(`Tanah Kosong: ${tile.name}`, `Harga: Rp ${tile.price}<br>Sewa: Rp ${tile.rent}`, 
                        [
                            {txt:"BELI", color:"#2ecc71", cb:()=>{ buyProp(player, tile); passTurn(); }},
                            {txt:"LEWATI", color:"#e74c3c", cb:()=>{ updateLog("Lewat..."); passTurn(); }}
                        ]);
                        return;
                    } else {
                        // Bot Strategy: Beli jika uang > 200
                        if (player.money > 200) buyProp(player, tile);
                    }
                }
            } else if (tile.owner !== player.id) {
                player.money -= tile.rent;
                opponent.money += tile.rent;
                updateLog(`💸 ${player.name} bayar sewa Rp ${tile.rent} di ${tile.name}`);
            }
        } 
        else if (tile.type === 'chance') {
            const luck = Math.random() > 0.5 ? 100 : -50;
            player.money += luck;
            updateLog(`❓ ${player.name} ambil Kesempatan: ${luck}`);
        }
        else if (tile.type === 'jail') {
            updateLog(`🔒 ${player.name} masuk penjara (cuma lewat)`);
        }

        renderBoard();
        checkWin();
        if (isHuman && tile.owner !== null) passTurn();
    }

    function buyProp(player, tile) {
        player.money -= tile.price;
        tile.owner = player.id;
        updateLog(`🏠 ${player.name} beli ${tile.name}`);
        renderBoard();
    }

    function checkWin() {
        if (p1.money < 0) endGame("Yah, Kamu Bangkrut! Bot Menang.");
        if (cpu.money < 0) endGame("Hore! Bot Bangkrut. Kamu Menang!");
    }

    function endGame(msg) {
        isGameActive = false;
        showModal("GAME OVER", msg, [{txt:"MAIN LAGI", color:"#4361ee", cb:()=>location.reload()}]);
    }

    // --- TURN SYSTEM ---
    function humanTurn() {
        if (!isGameActive) return;
        document.getElementById("btn-roll").disabled = true;
        document.getElementById("card-p1").classList.add("p1-active");
        document.getElementById("card-cpu").classList.remove("cpu-active");

        let dice = Math.floor(Math.random() * 6) + 1; // Dadu 1-6
        updateLog(`🎲 Kamu dapat angka ${dice}`);
        movePlayer(p1, dice);
        
        setTimeout(() => checkTile(p1), 500);
    }

    function passTurn() {
        if (!isGameActive) return;
        document.getElementById("card-p1").classList.remove("p1-active");
        document.getElementById("card-cpu").classList.add("cpu-active");
        
        setTimeout(() => {
            updateLog("🤖 Giliran Bot...");
            let dice = Math.floor(Math.random() * 6) + 1;
            updateLog(`🤖 Bot dapat angka ${dice}`);
            movePlayer(cpu, dice);
            checkTile(cpu);
            
            setTimeout(() => {
                if(isGameActive) {
                    document.getElementById("btn-roll").disabled = false;
                    document.getElementById("card-p1").classList.add("p1-active");
                    document.getElementById("card-cpu").classList.remove("cpu-active");
                    updateLog("👉 Giliranmu!");
                }
            }, 1000);
        }, 1500);
    }

    // --- MODAL HELPER ---
    function showModal(title, msg, buttons) {
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-msg").innerHTML = msg;
        const btnGroup = document.getElementById("modal-btns");
        btnGroup.innerHTML = '';
        
        buttons.forEach(btn => {
            const b = document.createElement("button");
            b.className = "btn-modal";
            b.style.backgroundColor = btn.color;
            b.innerText = btn.txt;
            b.onclick = () => {
                document.getElementById("modal-overlay").style.display = "none";
                btn.cb();
            };
            btnGroup.appendChild(b);
        });
        document.getElementById("modal-overlay").style.display = "flex";
    }

    // Start
    renderBoard();
</script>
</body>
</html>
